<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e151b" />
    <meta
      name="description"
      content="ONDA: baixe, organize e edite músicas, vídeos e imagens. Gratuito, de código aberto e sem anúncios. Para Windows e Android."
    />

    <title>
      ONDA — Sua mídia, do seu jeito.
    </title>

    <link rel="icon" href="assets/onda.svg" type="image/svg+xml" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("onda-site-theme") === "light" ? "light" : "dark";
      } catch {}
    </script>
    <link rel="stylesheet" href="style.css" />

    <script src="app.js" defer>
    </script>
  </head>

  <body>
    <a class="skip" href="#content" data-text="skip">
      Ir para o conteúdo
    </a>

    <div class="shell">
      <header>
        <a class="brand" href="#home" aria-label="ONDA">
          <svg width="36" height="36" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 64"><path fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" d="M 4 32 C 8 24 10 25 13 32 C 16 39 19 41 22 31 C 25 12 29 11 30 32 C 32 57 37 57 40 21 C 43 -5 48 -3 48 30 C 48 73 54 73 58 28 C 62 3 66 12 67 31 C 68 52 73 50 76 31 C 79 17 82 20 85 31 C 88 39 91 38 96 32"/></svg>
          ONDA
        </a>

        <nav aria-label="Menu">
          <a href="#home" data-nav="home">
            Início
          </a>
          <a href="#downloads" data-nav="downloads">
            Downloads
          </a>
          <a href="#features" data-nav="features">
            Recursos
          </a>
          <a href="#guide" data-nav="guide">
            Guia
          </a>
          <a href="#news" data-nav="news">
            Novidades
          </a>
          <a href="#about" data-nav="about">
            Sobre
          </a>
        </nav>

        <div class="tools">
          <button id="theme-toggle" type="button" aria-label="Modo claro" title="Modo claro" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" /></svg>
          </button>
          <select id="language" aria-label="Idioma">
            <option value="pt">
              PT-BR
            </option>
            <option value="es">
              ES
            </option>
            <option value="en">
              EN
            </option>
          </select>

          <a class="github" href="https://github.com/enzoandradee16/Onda">
            GitHub ↗
          </a>
        </div>
      </header>

      <main id="content" tabindex="-1">
      </main>

      <noscript>
        <p>
          ONDA — Windows e Android.
          <a href="https://github.com/enzoandradee16/Onda/releases/latest">
            Baixar / Descargar / Download
          </a>
        </p>
      </noscript>

      <footer>
        <span>
          ONDA
          <span class="dot">
            ·
          </span>
          GPL-2.0
        </span>

        <div>
          <a href="https://github.com/enzoandradee16/Onda" data-text="source">
            Código-fonte
          </a>
          <a href="#privacy" data-text="privacy">
            Privacidade
          </a>
          <a href="https://github.com/enzoandradee16/Onda/issues" data-text="feedback">
            Relatar problema ↗
          </a>
        </div>
      </footer>
    </div>
    <dialog id="image-viewer" aria-label="Ampliar captura do ONDA">
      <button class="image-viewer-close" type="button" autofocus>Fechar ×</button>
      <img class="image-viewer-image" alt="" />
    </dialog>
  </body>
</html>
